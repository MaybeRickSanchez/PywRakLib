name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Compile check
        run: python -m compileall -q raklib tools examples tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify entry points
        run: |
          python -c "from tools.proxy import main; from tools.scan import main; print('entry points OK')"
          python -c "import raklib; from raklib.server import Server; print('import OK')"